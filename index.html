<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instagram Story Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:#fff;
    color:#111;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .container {
    width:100%;
    max-width:420px;
    padding:20px 24px 30px;
  }
  .header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0 20px;
  }
  .brand svg {
    height:28px;
    width:auto;
    display:block;
  }
  .web-link {
    color:#5158e6;
    font-weight:600;
    font-size:15px;
    text-decoration:none;
  }
  .player {
    width:80%;
    margin:0 auto;
    aspect-ratio: 9/16;
    background:#050706;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:pointer;
    transition: opacity 0.3s;
  }
  .player.loading {
    opacity:0.6;
    pointer-events:none;
  }
  .play-icon {
    width:0;
    height:0;
    border-top:16px solid transparent;
    border-bottom:16px solid transparent;
    border-left:26px solid #fff;
    margin-left:6px;
    transition: transform 0.2s;
  }
  .player:hover .play-icon {
    transform: scale(1.1);
  }
  .msg-text {
    text-align:center;
    font-size:26px;
    line-height:1.3;
    font-weight:400;
    margin-top:26px;
    color:#111;
  }
  .msg-text b { font-weight:400; }
  .action-btn {
    display:block;
    width:100%;
    text-align:center;
    background:#5158e6;
    color:#fff;
    font-size:17px;
    font-weight:600;
    padding:14px 0;
    border:none;
    border-radius:10px;
    margin-top:28px;
    cursor:pointer;
    text-decoration:none;
    box-sizing:border-box;
    transition: background 0.3s;
  }
  .action-btn:hover {
    background:#3d44b8;
  }
  .signup-link {
    display:block;
    text-align:center;
    color:#5158e6;
    font-weight:600;
    font-size:16px;
    margin-top:16px;
    text-decoration:none;
  }
  .footer {
    text-align:center;
    color:#8e8e8e;
    font-size:13px;
    margin-top:22px;
    line-height:1.5;
  }
  .footer b { color:#8e8e8e; font-weight:600; }
  .footer a { color:#8e8e8e; text-decoration:none; }
  
  .loader {
    display:none;
    width:40px;
    height:40px;
    border:4px solid #f3f3f3;
    border-top:4px solid #5158e6;
    border-radius:50%;
    animation: spin 1s linear infinite;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
  }
  @keyframes spin {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }
  
  .status-line {
    text-align:center;
    font-size:14px;
    color:#5158e6;
    margin-top:10px;
    min-height:22px;
    display:none;
    font-weight:500;
  }
  .status-line.err { color:#d9534f; }
  .status-line.ok { color:#28a745; }
  
  .popup-overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.5); z-index:9999; padding:20px; box-sizing:border-box;
  }
  .popup-box {
    background:#fff; padding:24px; border-radius:16px; max-width:380px; text-align:center;
    box-shadow:0 6px 30px rgba(0,0,0,0.3);
  }
  .popup-box p { margin:0 0 12px 0; font-size:16px; }
  .popup-box .popup-btn {
    background:#5158e6; color:#fff; border:none; padding:12px 24px;
    border-radius:10px; font-size:16px; font-weight:600; cursor:pointer;
    width:100%;
    transition: background 0.3s;
  }
  .popup-box .popup-btn:hover {
    background:#3d44b8;
  }
  .popup-box .hint { font-size:12px; color:#666; margin-top:10px; }
